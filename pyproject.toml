[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "convlint"
version = "0.1.0.dev0"
description = "Lint and convert tool-calling conversation datasets for fine-tuning"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Shehroz Ahmed", email = "shozy.khantastic@gmail.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
