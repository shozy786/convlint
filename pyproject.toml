[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "convlint"
version = "0.1.0.dev0"
description = "Lint and convert tool-calling conversation datasets for fine-tuning"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Shehroz Ahmed", email = "shozy.khantastic@gmail.com" }]
dependencies = ["jsonschema>=4.18", "click>=8.1"]

[project.optional-dependencies]
tokens = ["tiktoken>=0.7"]
dev = ["pytest>=8", "tiktoken>=0.7"]

[project.scripts]
convlint = "convlint.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
